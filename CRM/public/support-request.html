<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit a support request</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f7f8f2; background: #0d1526; font-family: 'Segoe UI', system-ui, sans-serif; }
      main { width: min(100%, 520px); padding: 36px 32px 44px; border: 1px solid #ffffff18; border-radius: 18px; background: #172239; }
      h1 { margin: 0 0 10px; letter-spacing: -.03em; }
      p.intro { margin: 0 0 26px; color: #9ba9bf; line-height: 1.5; }
      label { display: block; margin: 16px 0 8px; color: #dbe5f2; font-size: .86rem; font-weight: 600; }
      input, textarea { width: 100%; padding: 13px 14px; color: #f7f8f2; border: 1px solid #536178; border-radius: 10px; outline: none; background: #1b263b; font: inherit; }
      textarea { min-height: 120px; resize: vertical; }
      input:focus, textarea:focus { border-color: #f4d35e; box-shadow: 0 0 0 4px #f4d35e1f; }
      button { width: 100%; margin-top: 24px; padding: 14px 15px; color: #202337; border: 0; border-radius: 10px; background: #f4d35e; cursor: pointer; font: inherit; font-weight: 700; }
      button:hover:not(:disabled) { background: #ffe48a; }
      button:disabled { cursor: wait; opacity: .65; }
      #feedback { min-height: 22px; margin: 14px 0 0; color: #ff9b8a; font-size: .88rem; }
      #feedback.success { color: #a7f3d0; overflow-wrap: anywhere; }
    </style>
    <script type="module" src="/support-request.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Submit a support request</h1>
      <p class="intro">Already a customer? Send us your request and we will reply with a support reference.</p>
      <form id="request-form">
        <label>Email <input name="email" type="email" required maxlength="320" /></label>
        <label>Subject <input name="subject" required maxlength="200" /></label>
        <label>Category <input name="category" maxlength="100" placeholder="Optional" /></label>
        <label>Due date <input name="dueDate" type="date" /></label>
        <label>Message <textarea name="message" required maxlength="2000"></textarea></label>
        <button type="submit">Submit request</button>
        <p id="feedback" role="alert"></p>
      </form>
    </main>
  </body>
</html>
