<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Portal</title>
    <script type="module" src="/portal.js" defer></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
      :root { font-family: 'DM Sans', sans-serif; color: #f7f8f2; background: #111827; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { min-height: 100vh; margin: 0; background: #111827; }
      body::before { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 10% 15%, #ef835455 0 12%, transparent 31%), radial-gradient(circle at 90% 85%, #5ec8b055 0 10%, transparent 28%), linear-gradient(135deg, #17233b 0%, #111827 52%, #192d31 100%); content: ''; }
      body::after { position: fixed; inset: 0; z-index: -1; opacity: .16; background-image: linear-gradient(#ffffff 1px, transparent 1px), linear-gradient(90deg, #ffffff 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, black, transparent 80%); content: ''; }
      main.login-shell { width: min(1080px, calc(100% - 48px)); min-height: 620px; margin: 4vh auto; border: 1px solid #ffffff2b; border-radius: 24px; box-shadow: 0 32px 100px #00000055; display: grid; grid-template-columns: minmax(280px, .92fr) minmax(340px, 1.08fr); animation: rise-in .7s ease-out both; }
      .brand-panel { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 620px; padding: 40px; overflow: hidden; background: linear-gradient(150deg, #e9785b 0%, #d75c80 47%, #6752a7 100%); border-radius: 24px 0 0 24px; }
      .brand-panel::before, .brand-panel::after { position: absolute; border: 1px solid #ffffff35; border-radius: 50%; content: ''; }
      .brand-panel::before { width: 360px; height: 360px; right: -170px; top: 140px; }
      .brand-panel::after { width: 220px; height: 220px; right: -100px; top: 210px; }
      .brand, .eyebrow { position: relative; z-index: 1; }
      .brand { display: flex; align-items: center; gap: 12px; font-family: 'Space Grotesk', sans-serif; font-size: 1.05rem; font-weight: 700; letter-spacing: .02em; }
      .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; color: #1d2337; border-radius: 10px; background: #f4d35e; box-shadow: 5px 5px 0 #1d233755; }
      .brand-mark::before { width: 13px; height: 13px; border: 3px solid #1d2337; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); content: ''; }
      .brand-copy { position: relative; z-index: 1; max-width: 380px; }
      .eyebrow { color: #f4d35e; font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      .brand-copy h2 { margin: 14px 0 16px; font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.25rem, 4vw, 3.8rem); line-height: .98; letter-spacing: -.04em; }
      .brand-copy p { max-width: 290px; margin: 0; color: #ffffffcc; line-height: 1.6; }
      .signal { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; color: #ffffffcc; font-size: .82rem; }
      .signal i { width: 8px; height: 8px; border-radius: 50%; background: #a7f3d0; box-shadow: 0 0 0 5px #a7f3d033; }
      .form-panel { display: grid; align-items: center; padding: 56px clamp(32px, 7vw, 88px); background: #101827cc; border-radius: 0 24px 24px 0; }
      .form-wrap { width: 100%; max-width: 360px; margin: 0 auto; }
      h1 { margin: 0 0 10px; font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 4vw, 2.65rem); letter-spacing: -.04em; }
      .form-intro { margin: 0 0 34px; color: #9ba9bf; line-height: 1.5; }
      label { display: block; margin: 18px 0 8px; color: #dbe5f2; font-size: .86rem; font-weight: 600; }
      input, button { width: 100%; padding: 14px 15px; font: inherit; }
      input { color: #f7f8f2; border: 1px solid #536178; border-radius: 10px; outline: none; background: #1b263b; transition: border-color .2s, box-shadow .2s, background .2s; }
      input::placeholder { color: #718198; }
      input:focus { border-color: #f4d35e; background: #202e46; box-shadow: 0 0 0 4px #f4d35e1f; }
      button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; margin-top: 24px; color: #202337; border: 0; border-radius: 10px; background: #f4d35e; cursor: pointer; font-weight: 700; box-shadow: 0 10px 24px #f4d35e20; transition: transform .2s, background .2s, box-shadow .2s; }
      button:hover:not(:disabled) { background: #ffe48a; box-shadow: 0 14px 28px #f4d35e35; transform: translateY(-2px); }
      button:disabled { cursor: wait; opacity: .65; }
      .secondary { color: #c5d0df; border: 1px solid #536178; background: transparent; box-shadow: none; }
      .secondary:hover { background: #ffffff08; box-shadow: none; transform: none; }
      [role="alert"] { min-height: 22px; margin: 14px 0 0; color: #ff9b8a; font-size: .86rem; }
      .fine-print { margin-top: 26px; color: #718198; font-size: .76rem; text-align: center; }
      .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: #718198; font-size: .78rem; }
      .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #ffffff12; }
      @keyframes rise-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 900px) { main.login-shell { grid-template-columns: 1fr; } .brand-panel { display: none; } .form-panel { border-radius: 24px; } }
    </style>
  </head>
  <body>
    <main class="login-shell" id="login-shell">
      <section class="brand-panel">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Northstar CRM</span></div>
        <div class="brand-copy"><span class="eyebrow">Your work, in focus</span><h2>Make every relationship count.</h2><p>A calmer way to keep your customer universe moving forward.</p></div>
        <div class="signal"><i aria-hidden="true"></i><span>Workspace online</span></div>
      </section>
      <section class="form-panel">
        <div class="form-wrap">
          <h1>Customer Portal</h1>
          <p class="form-intro">Sign in to view your requests and submit feedback.</p>
          <form id="customer-login" novalidate>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
            <p role="alert" id="login-error"></p>
            <button type="submit"><span>Log in</span><span aria-hidden="true">&#8594;</span></button>
          </form>
          <p class="fine-print">Customer workspace · Secure sign in</p>
        </div>
      </section>
    </main>
    <main id="workspace" hidden>
      <div style="max-width: 960px; margin: 0 auto; padding: 56px 20px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px;">
          <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 4vw, 2.65rem); letter-spacing: -.04em;">Your requests</h1>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <a href="/knowledge-base" class="secondary" style="width: auto; padding: 10px 14px; text-decoration: none;">Knowledge base</a>
            <a href="/support/request" class="secondary" style="width: auto; padding: 10px 14px; text-decoration: none;">Submit a ticket</a>
            <button id="list-tickets" class="secondary" style="width: auto; margin-top: 0; padding: 10px 14px;">Your requests</button>
            <button id="logout" class="secondary" style="width: auto; margin-top: 0; padding: 10px 14px;">Log out</button>
          </div>
        </div>
        <div id="tickets"></div>
        <section id="detail"></section>
      </div>
    </main>
  </body>
</html>
